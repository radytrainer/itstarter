# Local stack: `docker compose up -d --build` → http://localhost:8088
# For day-to-day coding, run only the databases (`npm run docker:deps`) and use `npm run dev`.
name: itstarter

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itstarter}
      POSTGRES_USER: ${POSTGRES_USER:-itstarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache only: no persistence, bounded memory. PostgreSQL is the source of truth.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: itstarter-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-itstarter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-itstarter}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://localhost:${NGINX_HOST_PORT:-8088}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SELF_REGISTRATION: ${SELF_REGISTRATION:-open}
      # The local stack is plain HTTP; production (HTTPS) leaves this at its default (true).
      COOKIE_SECURE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off jobs with the API image (not started by `up`):
  #   docker compose run --rm tools node apps/api/dist/migrate.js
  #   docker compose run --rm tools node apps/api/dist/seed.js
  # Seed passwords live only here, not in the running API's environment.
  tools:
    image: itstarter-api:local
    profiles: ['tools']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-itstarter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-itstarter}
      REDIS_URL: redis://redis:6379 # the seed refreshes the content cache
      APP_ORIGIN: http://localhost:${NGINX_HOST_PORT:-8088} # localhost = local stack (dev passwords allowed)
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: itstarter-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - '${NGINX_HOST_PORT:-8088}:80'
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
